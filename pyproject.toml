[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "service-bus"
version = "0.1.0"
description = "Service lifecycle management and discovery over a seda-bus"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Brian Taylor", email = "brian@resolvingarchitecture.io" }]
keywords = ["seda", "service-bus", "microservice", "lifecycle", "message-bus"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["seda-bus"]

[project.urls]
Homepage = "https://resolvingarchitecture.io"
Repository = "https://github.com/resolvingarchitecture/service-bus-python"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/service_bus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
